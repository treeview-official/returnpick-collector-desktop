name: Windows collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ReturnPick-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReturnPick-Windows
          path: release
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; build artifacts are retained in Actions."
          else
            gh release create "$TAG" release/*.exe --draft --title "ReturnPick Collector $TAG" --notes "Windows 수집 전용 앱. 설치형(setup) 또는 무설치형(portable)을 다운로드하세요."
          fi
